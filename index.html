        // ============ UTILITY FUNCTIONS ============
        
        /**
         * Sanitize user input to prevent XSS attacks
         */
        function sanitizeInput(input) {
            if (typeof input !== 'string') return '';
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        /**
         * Validate image URL format
         */
        function isValidImageUrl(url) {
            try {
                const urlObj = new URL(url);
                const validDomains = ['storage.googleapis.com', 'placehold.co', 'classdogs.com'];
                return validDomains.some(domain => urlObj.hostname.includes(domain)) &&
                       /\.(jpg|jpeg|png|webp|gif)$/i.test(urlObj.pathname);
            } catch {
                return false;
            }
        }

        /**
         * Validate breed data structure
         */
        function validateBreedData(breed) {
            const errors = [];
            
            if (!breed.breed || typeof breed.breed !== 'string' || breed.breed.trim().length === 0) {
                errors.push('Breed name is required and must be a string');
            }
            
            if (!Number.isFinite(breed.price) || breed.price < 0) {
                errors.push('Price must be a positive number');
            }
            
            if (!breed.description || typeof breed.description !== 'string') {
                errors.push('Description is required');
            }
            
            if (!Array.isArray(breed.images) || breed.images.length === 0) {
                errors.push('At least one valid image is required');
            }
            
            if (breed.images.some(img => !isValidImageUrl(img))) {
                errors.push('One or more image URLs are invalid');
            }
            
            return { isValid: errors.length === 0, errors };
        }

        /**
         * Resolve image URL safely
         */
        function resolveImageUrl(src) {
            if (!src) {
                return "https://placehold.co/800x600/CCCCCC/666666?text=No+Image";
            }
            
            if (src.startsWith('http') || src.startsWith('data:')) {
                if (isValidImageUrl(src)) {
                    return src;
                }
                return "https://placehold.co/800x600/CCCCCC/666666?text=Invalid+URL";
            }
            
            const fullUrl = APP_CONFIG.cloudBucketUrl + APP_CONFIG.imageSubfolder + src;
            return isValidImageUrl(fullUrl) ? fullUrl : "https://placehold.co/800x600/CCCCCC/666666?text=Invalid+URL";
        }

        /**
         * Safe HTML element creation from text
         */
        function createSafeTextElement(text) {
            const span = document.createElement('span');
            span.textContent = sanitizeInput(text);
            return span.innerHTML;
        }

            deleteBreed(id) {

                this.saveToLocalStorage();
            },

            const bodyEl = document.getElementById('modal-body');

            titleEl.textContent = sanitizeInput(title);

            if (type === 'error') {
                bodyEl.className = 'mb-6 text-sm text-red-600 error-message';
                bodyEl.innerHTML = `<strong>Error:</strong> ${sanitizeInput(body)}`;
            } else if (type === 'success') {
                bodyEl.className = 'mb-6 text-sm text-green-600 success-message';
                bodyEl.innerHTML = `<strong>Success:</strong> ${sanitizeInput(body)}`;
            } else {
                bodyEl.className = 'mb-6 text-sm text-gray-600';
                bodyEl.textContent = sanitizeInput(body);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modal.setAttribute('aria-hidden', 'false');

            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

                if (Array.isArray(data)) {
                    const validBreeds = data.filter(breed => {
                        const validation = validateBreedData(breed);
                        return validation.isValid;
                    });
                    
                    if (validBreeds.length > 0) {
                        AppState.setBreeds(validBreeds);
                    } else {
                        AppState.loadFromLocalStorage();
                    }
                } else {
                    AppState.loadFromLocalStorage();
                }
            } catch (error) {
                console.warn('Cloud load failed, using local storage:', error);
                AppState.loadFromLocalStorage();
            }

            const currentHash = window.location.hash.replace('#', '') || 'home';
            window.appNavigate(currentHash);

                    btn.classList.add('nav-active');

            });

            contentDiv.innerHTML = '';
            contentDiv.classList.add('slide-in-right');

            try {
                if (parts[0] === 'details' && parts.length === 2) {
                    contentDiv.innerHTML = renderBreedDetailsPage(parts[1]);

                    switch (parts[0]) {
                        case 'home':

            `;
        }

        function renderAdminAuth() {
            return `
                <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10">
                    <h2 class="text-2xl font-bold mb-6 text-center">Admin Access</h2>
                    <p class="text-xs text-gray-500 mb-6 text-center">Note: Admin credentials must be verified server-side. This is a frontend placeholder.</p>
                    <input type="email" id="admin-email" placeholder="Email" class="w-full p-3 border rounded-lg mb-4 text-sm" required>
                    <input type="password" id="admin-password" placeholder="Password" class="w-full p-3 border rounded-lg mb-6 text-sm" required>
                    <button onclick="window.handleAdminLogin()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition">Login</button>
                </div>
            `;
        }

        // ============ ADMIN FUNCTIONS ============

        window.handleAdminLogin = async () => {
            const email = document.getElementById('admin-email')?.value || '';
            const pass = document.getElementById('admin-password')?.value || '';

            if (!email || !pass) {
                window.showModal("Error", "Email and password are required.", "error");
                return;
            }

            // In production, this should call a backend API
            // For now, we'll use a simple local validation
            // WARNING: Never store credentials on client side in production
            
            const VALID_EMAIL = "trumph191@gmail.com";
            const VALID_PASSWORD_HASH = btoa("Classdogs2022"); // Basic encoding, use proper hashing in production

            if (email === VALID_EMAIL && btoa(pass) === VALID_PASSWORD_HASH) {
                const sessionToken = btoa(Date.now().toString());
                AppState.setAdmin(true, sessionToken);
                window.showModal("Success", "Login successful!", "success");
                setTimeout(() => window.appNavigate('admin'), 1000);
            } else {
                window.showModal("Login Failed", "Incorrect credentials provided.", "error");
            }
        };

        function renderAdminPanel() {
            const contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = `
                <div class="max-w-4xl mx-auto px-2">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h2 class="text-2xl md:text-3xl font-bold">Admin Panel</h2>
                        <div class="flex space-x-3 w-full md:w-auto">
                            <button onclick="window.downloadBreedsJSON()" class="flex-1 md:flex-none bg-blue-600 text-white px-4 py-2 rounded-lg font-bold flex items-center justify-center text-xs hover:bg-blue-700 transition">
                                <i data-lucide="download" class="w-4 h-4 mr-2"></i>Download JSON
                            </button>
                            <button onclick="window.handleAdminLogout()" class="flex-1 md:flex-none text-red-600 font-semibold border border-red-200 px-4 py-2 rounded-lg hover:bg-red-50 transition">
                                Logout
                            </button>
                        </div>
                    </div>
                    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-lg border-t-4 border-orange-500 mb-8">
                        <h3 class="text-lg md:text-xl font-bold mb-6">Add New Breed Listing</h3>
                        <form id="add-breed-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <select id="b-name" class="p-3 border rounded-lg text-sm" required>
                                    <option value="" disabled selected>Select Breed</option>
                                    ${WORLD_BREEDS.map(breed => `<option value="${sanitizeInput(breed)}">${breed}</option>`).join('')}
                                </select>
                                <input type="number" id="b-price" placeholder="Price (KES)" class="p-3 border rounded-lg text-sm" min="0" required>
                                <input type="text" id="b-age" placeholder="Age (e.g. 3 Months)" class="p-3 border rounded-lg text-sm">
                                <select id="b-gender" class="p-3 border rounded-lg text-sm">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                                <input type="text" id="b-purity" placeholder="Purity (e.g. Purebred)" class="p-3 border rounded-lg text-sm">
                            </div>
                            <textarea id="b-desc" placeholder="Full Description" class="w-full p-3 border rounded-lg h-32 text-sm" required></textarea>
                            
                            <div class="space-y-2">
                                <p class="text-xs font-bold text-gray-500">Image URLs (Up to 8)</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="image-inputs-container">
                                    ${[...Array(8)].map((_, i) => `<input type="url" class="b-img-url p-2 text-xs border rounded" placeholder="Image URL ${i+1}">`).join('')}
                                </div>
                            </div>
                            <button type="button" onclick="window.saveNewBreed()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition text-sm">Save to List</button>
                        </form>
                    </div>
                    <div id="admin-breeds-list" class="space-y-4"></div>
                </div>
            `;
            renderAdminBreedsList();
            lucide.createIcons();
        }

        function renderAdminBreedsList() {
            const container = document.getElementById('admin-breeds-list');
            if (AppState.breeds.length === 0) {
                container.innerHTML = '<p class="text-center text-sm">No breeds in database.</p>';
                return;
            }

            container.innerHTML = `<h3 class="text-lg font-bold mb-4">Current Listings (${AppState.breeds.length})</h3>` + AppState.breeds.map(b => `
                <div class="bg-white p-4 rounded-xl shadow border flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm md:text-base">${sanitizeInput(b.breed)}</p>
                        <p class="text-[10px] md:text-sm text-gray-500">KES ${b.price.toLocaleString()} | ${sanitizeInput(b.gender || 'N/A')} | ID: ${b.id}</p>
                    </div>
                    <button onclick="window.deleteBreed(${b.id})" class="text-red-500 p-2 hover:text-red-700 transition" aria-label="Delete listing">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.saveNewBreed = () => {
            const breedVal = document.getElementById('b-name').value;
            const price = parseInt(document.getElementById('b-price').value);
            const desc = document.getElementById('b-desc').value;
            const age = document.getElementById('b-age').value;
            const gender = document.getElementById('b-gender').value;
            const purity = document.getElementById('b-purity').value;

            const imgInputs = document.querySelectorAll('.b-img-url');
            const images = Array.from(imgInputs)
                .map(i => i.value.trim())
                .filter(v => v !== "" && isValidImageUrl(v));
            
            // Validation
            if (!breedVal) {
                window.showModal("Error", "Please select a breed.", "error");
                return;
            }
            if (isNaN(price) || price < 0) {
                window.showModal("Error", "Price must be a positive number.", "error");
                return;
            }
            if (!desc || desc.trim().length === 0) {
                window.showModal("Error", "Description is required.", "error");
                return;
            }
            if (images.length === 0) {
                window.showModal("Error", "At least one valid image URL is required.", "error");
                return;
            }

            const newBreed = {
                id: Date.now(),
                breed: sanitizeInput(breedVal),
                price: price,
                description: sanitizeInput(desc),
                age: sanitizeInput(age),
                gender: sanitizeInput(gender),
                purity: sanitizeInput(purity),
                images: images
            };

            try {
                AppState.addBreed(newBreed);
                window.showModal("Success", "Listing added locally. Click 'Download JSON' to export and upload to cloud.", "success");
                renderAdminPanel();
            } catch (error) {
                window.showModal("Error", error.message, "error");
            }
        };

        window.deleteBreed = (id) => {
            if (confirm("Are you sure you want to delete this listing?")) {
                AppState.deleteBreed(id);
                renderAdminPanel();
                window.showModal("Success", "Listing deleted.", "success");
            }
        };

        window.downloadBreedsJSON = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState.breeds, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "breed.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        window.handleAdminLogout = () => {
            AppState.setAdmin(false);
            window.showModal("Logged Out", "You have been logged out.", "success");
            setTimeout(() => window.appNavigate('home'), 1000);
        };

        // ============ SLIDESHOW FUNCTIONS ============

        window.startGallerySlideshow = () => {
            const slideshow = document.getElementById('gallery-slideshow');
            if (!slideshow) return;

            let current = 0;
            const items = slideshow.children.length;
            slideshow.style.width = `${items * 100}%`;
            Array.from(slideshow.children).forEach(child => child.style.width = `${100 / items}%`);

            window.changeGallerySlide = (dir) => {
                current = (current + dir + items) % items;
                slideshow.style.transform = `translateX(-${current * (100 / items)}%)`;
            };

            if (window.galInt) clearInterval(window.galInt);
            window.galInt = setInterval(() => {
                if (!AppState.galleryPaused) window.changeGallerySlide(1);
            }, 4000);
        };

        window.startChampionSlideshow = () => {
            const slideshow = document.getElementById('champ-slideshow');
            if (!slideshow) return;

            let current = 0;
            const items = slideshow.children.length;
            slideshow.style.width = `${items * 100}%`;
            Array.from(slideshow.children).forEach(child => child.style.width = `${100 / items}%`);

            window.changeChampSlide = (dir) => {
                current = (current + dir + items) % items;
                slideshow.style.transform = `translateX(-${current * (100 / items)}%)`;
            };

            if (window.champInt) clearInterval(window.champInt);
            window.champInt = setInterval(() => {
                if (!AppState.champPaused) window.changeChampSlide(1);
            }, 6000);
        };

        // ============ LEGAL TAB SWITCHING ============

        window.openLegalTab = (evt, name) => {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.legal-tab-button').forEach(tb => tb.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            evt.currentTarget.classList.add('active');
        };

        // ============ SCHEMA UPDATES ============

        function updateBreedSchema(breed) {
            document.getElementById('dynamic-breed-schema')?.remove();

            const script = document.createElement('script');
            script.id = 'dynamic-breed-schema';
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify({
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": breed.breed,
                "image": resolveImageUrl(breed.images[0]),
                "description": breed.description,
                "brand": { "@type": "Brand", "name": "Class Dogs Ltd" },
                "offers": {
                    "@type": "Offer",
                    "url": window.location.href,
                    "priceCurrency": "KES",
                    "price": breed.price,
                    "availability": "https://schema.org/InStock"
                }
            });
            document.head.appendChild(script);
        }

        // ============ LOGO CLICK HANDLER ============

        document.getElementById('logo-trigger').addEventListener('click', function() {
            AppState.logoClicks++;
            if (AppState.logoClicks >= APP_CONFIG.logoClickCountTrigger) {
                document.getElementById('nav-admin-btn').classList.remove('hidden');
                AppState.logoClicks = 0;
            }
        });

        document.getElementById('logo-trigger').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                AppState.logoClicks++;
                if (AppState.logoClicks >= APP_CONFIG.logoClickCountTrigger) {
                    document.getElementById('nav-admin-btn').classList.remove('hidden');
                    AppState.logoClicks = 0;
                }
            }
        });

        // ============ ROUTE HANDLING ============

        window.addEventListener('hashchange', () => {
            const currentHash = window.location.hash.replace('#', '') || 'home';
            window.appNavigate(currentHash);
        });

        // ============ APP INITIALIZATION ============

        window.addEventListener('load', loadDataFromCloud);
    </script>
</body>
</html>
